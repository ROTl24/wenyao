name: Release Windows application

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build and upload draft release
        run: npm run release:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify local release artifacts
        run: npm run verify:release

      - name: Verify assets and publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view "$env:GITHUB_REF_NAME" --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release must remain a draft until all assets pass verification"
          }
          if ($release.isPrerelease) {
            throw "Stable update tags must not create prereleases"
          }

          $packageVersion = node -p "require('./package.json').version"
          $requiredAssets = @(
            "WenYao-$packageVersion-Setup.exe",
            "WenYao-$packageVersion-Setup.exe.blockmap",
            "latest.yml"
          )
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $missingAssets = @($requiredAssets | Where-Object { $_ -notin $assetNames })
          if ($missingAssets.Count -gt 0) {
            throw "Draft release is missing assets: $($missingAssets -join ', ')"
          }

          gh release edit "$env:GITHUB_REF_NAME" --draft=false --prerelease=false --latest
